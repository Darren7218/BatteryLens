plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darren.batterylens'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darren.batterylens'
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName '3.4'
        resValue 'string', 'app_name', 'BatteryLens'
    }

    buildTypes {
        debug {
            // Stable preview ID; SDK-only build reuses the 3.3 preview test key.
            applicationIdSuffix '.preview33'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'BatteryLens 3.4 Preview'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
