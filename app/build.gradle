plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darren.batterylens'
    compileSdk 36

    defaultConfig {
        applicationId 'com.darren.batterylens'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
